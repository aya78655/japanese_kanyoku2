<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>慣用句クイズ</title>
<style>
  :root{
    --bg:#f7f5f0;
    --card:#ffffff;
    --ink:#2d2a26;
    --sub:#6b6560;
    --accent:#3a6b5c;
    --accent-soft:#e7efec;
    --correct:#3a7d3a;
    --correct-bg:#e6f4e6;
    --wrong:#b3452e;
    --wrong-bg:#fbe9e5;
    --border:#e3ddd2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.7;
    padding-bottom:60px;
    min-height:100vh;
  }
  header{
    text-align:center;
    padding:36px 16px 12px;
  }
  header h1{
    margin:0 0 8px;
    font-size:1.6rem;
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:0.95rem;
  }
  .progress-wrap{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(247,245,240,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:12px 16px;
  }
  .progress-inner{
    max-width:720px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    font-size:0.85rem;
    color:var(--sub);
  }
  .progress-bar-track{
    flex:1;
    height:6px;
    background:var(--accent-soft);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;
    background:var(--accent);
    border-radius:999px;
    transition:width .25s ease;
  }
  .progress-inner strong{
    color:var(--accent);
    white-space:nowrap;
  }
  main{
    max-width:720px;
    margin:0 auto;
    padding:24px 16px 0;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px 22px 20px;
  }
  .q-body{
    display:flex;
    gap:18px;
    align-items:flex-start;
  }
  .q-image-wrap{
    flex:0 0 220px;
    width:220px;
    height:150px;
    border-radius:12px;
    overflow:hidden;
    background:var(--accent-soft);
    border:1px solid var(--border);
  }
  .q-image{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .q-image-fallback{
    width:100%;
    height:100%;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:2.6rem;
  }
  .q-content{
    flex:1;
    min-width:0;
  }
  @media (max-width:480px){
    .q-body{
      flex-direction:column;
    }
    .q-image-wrap{
      width:100%;
      height:220px;
    }
  }
  .q-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .q-num{
    font-size:0.8rem;
    color:var(--sub);
    background:var(--accent-soft);
    border-radius:999px;
    padding:2px 10px;
  }
  .q-term{
    font-size:1.35rem;
    font-weight:700;
  }
  .q-emoji{
    font-size:1.4rem;
  }
  .q-reading{
    font-size:0.85rem;
    color:var(--sub);
  }
  .q-meaning-prompt{
    font-size:1.05rem;
    line-height:1.8;
    background:var(--accent-soft);
    border-radius:10px;
    padding:14px 16px;
    margin:2px 0 4px;
  }
  .mode-switch{
    max-width:720px;
    margin:14px auto 0;
    padding:0 16px;
    display:flex;
    gap:8px;
  }
  .mode-btn{
    flex:1;
    padding:10px 8px;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:#fff;
    color:var(--sub);
    font-size:0.88rem;
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
  }
  .mode-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:700;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  button.choice{
    text-align:left;
    padding:13px 14px;
    border:1.5px solid var(--border);
    border-radius:10px;
    background:#fff;
    font-size:1rem;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  button.choice:hover:not(:disabled){
    border-color:var(--accent);
  }
  button.choice:disabled{
    cursor:default;
  }
  button.choice .label{
    font-weight:700;
    margin-right:8px;
    color:var(--accent);
  }
  button.choice.correct{
    background:var(--correct-bg);
    border-color:var(--correct);
    color:var(--correct);
  }
  button.choice.wrong{
    background:var(--wrong-bg);
    border-color:var(--wrong);
    color:var(--wrong);
  }
  .feedback{
    margin-top:16px;
    font-size:1rem;
    font-weight:700;
    min-height:1.4em;
  }
  .feedback.ok{ color:var(--correct); }
  .feedback.no{ color:var(--wrong); }

  .next-wrap{
    margin-top:18px;
    text-align:right;
  }
  .next-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 24px;
    border-radius:999px;
    font-size:0.95rem;
    cursor:pointer;
    opacity:0;
    transform:translateY(4px);
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .next-btn.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .next-btn:hover{
    opacity:0.9;
  }

  .result-card{
    text-align:center;
    padding:40px 22px;
  }
  .result-score{
    font-size:3rem;
    font-weight:800;
    color:var(--accent);
    margin:10px 0 4px;
  }
  .result-score span{
    font-size:1.3rem;
    color:var(--sub);
    font-weight:600;
  }
  .result-msg{
    color:var(--sub);
    margin-bottom:26px;
  }
  .result-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:center;
  }
  .result-actions button{
    border:none;
    padding:12px 28px;
    border-radius:999px;
    font-size:0.95rem;
    cursor:pointer;
    min-width:240px;
  }
  .result-actions button:hover{
    opacity:0.9;
  }
  .btn-primary{
    background:var(--accent);
    color:#fff;
  }
  .btn-secondary{
    background:var(--accent-soft);
    color:var(--accent);
  }
  footer{
    text-align:center;
    color:var(--sub);
    font-size:0.8rem;
    padding:30px 16px 10px;
  }
</style>
</head>
<body>

<div class="progress-wrap">
  <div class="progress-inner">
    <span id="progress-label">1問目 / 45問中</span>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    <strong id="score-label">正解 0</strong>
  </div>
</div>

<header>
  <h1>慣用句クイズ</h1>
  <p id="instruction">正しい意味を選んでください。1問ずつ答え合わせをしながら進みます。</p>
</header>

<div class="mode-switch" id="mode-switch">

<main id="quiz"></main>

<footer>全45問 &middot; 慣用句の意味クイズ</footer>

const CONFLICTS = {"浮き足立つ": ["寝耳に水", "目の色を変える", "目を白黒させる", "目を皿にする"], "二の足を踏む": ["腰が重い"], "顔を立てる": ["肩身が狭い"], "肩身が狭い": ["顔を立てる"], "きびすを返す": ["手を引く"], "肝が据わる": ["本腰を入れる", "腹を決める"], "口を閉ざす": ["口をぬぐう"], "口をぬぐう": ["口を閉ざす", "面の皮が厚い"], "首が回らない": ["爪に火をともす", "目が回る"], "本腰を入れる": ["肝が据わる", "腹を決める"], "腰が重い": ["二の足を踏む"], "爪に火をともす": ["目が回る", "私腹を肥やす", "首が回らない"], "面の皮が厚い": ["口をぬぐう"], "手ぐすね引く": ["手を加える"], "手を引く": ["きびすを返す"], "手をわずらわす": ["胸を借りる"], "手を加える": ["手ぐすね引く"], "私腹を肥やす": ["爪に火をともす"], "腹に一物": ["目に物見せる"], "腹を決める": ["本腰を入れる", "肝が据わる"], "はらわたがちぎれる": ["目頭が熱くなる", "胸を痛める", "身につまされる"], "身につまされる": ["はらわたがちぎれる", "目頭が熱くなる", "胸を痛める"], "寝耳に水": ["浮き足立つ", "目の色を変える", "目を白黒させる", "目を皿にする"], "胸がすく": ["目尻を下げる"], "胸を痛める": ["はらわたがちぎれる", "目頭が熱くなる", "身につまされる"], "胸を借りる": ["手をわずらわす"], "目頭が熱くなる": ["はらわたがちぎれる", "胸を痛める", "身につまされる"], "目が回る": ["爪に火をともす", "首が回らない"], "目尻を下げる": ["胸がすく"], "目に物見せる": ["腹に一物"], "目の色を変える": ["寝耳に水", "浮き足立つ", "目を奪う", "目を引く", "目を白黒させる", "目を皿にする"], "目を奪う": ["目の色を変える", "目を引く"], "目を皿にする": ["寝耳に水", "浮き足立つ", "目の色を変える", "目を白黒させる"], "目を白黒させる": ["寝耳に水", "浮き足立つ", "目の色を変える", "目を皿にする"], "目を引く": ["目の色を変える", "目を奪う"]};

const LABELS = ["A","B","C","D"];

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const quizEl = document.getElementById("quiz");
const progressLabel = document.getElementById("progress-label");
const progressFill = document.getElementById("progress-fill");
const scoreLabel = document.getElementById("score-label");
const instructionEl = document.getElementById("instruction");
const modeSwitchEl = document.getElementById("mode-switch");

const INSTRUCTIONS = {
  term: "正しい意味を選んでください。1問ずつ答え合わせをしながら進みます。",
  meaning: "意味に合う慣用句を選んでください。1問ずつ答え合わせをしながら進みます。"
};

const allIndices = QUESTIONS.map((_, i) => i);
let activeIndices = allIndices.slice();
let current = 0;
let score = 0;
let wrongIndices = [];
let mode = "term";

modeSwitchEl.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.mode === mode) return;
    mode = btn.dataset.mode;
    modeSwitchEl.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === btn));
    instructionEl.textContent = INSTRUCTIONS[mode];
    activeIndices = allIndices.slice();
    current = 0;
    score = 0;
    wrongIndices = [];
    renderQuestion();
  });
});

function updateProgress(){
  const total = activeIndices.length;
  const shown = Math.min(current + 1, total);
  progressLabel.textContent = current < total
    ? `${shown}問目 / ${total}問中`
    : `終了 / ${total}問中`;
  progressFill.style.width = (current / total * 100) + "%";
  scoreLabel.textContent = `正解 ${score}`;
}

function renderQuestion(){
  updateProgress();
  const idx = activeIndices[current];
  const q = QUESTIONS[idx];
  quizEl.innerHTML = "";

  const card = document.createElement("div");
  card.className = "card";

  const body = document.createElement("div");
  body.className = "q-body";

  const imageWrap = document.createElement("div");
  imageWrap.className = "q-image-wrap";
  const img = document.createElement("img");
  img.className = "q-image";
  img.alt = q.term + "のイラスト";
  const fallback = document.createElement("div");
  fallback.className = "q-image-fallback";
  fallback.textContent = q.emoji;
  const num = String(idx + 1).padStart(2, "0");
  const exts = ["png", "jpg", "jpeg", "webp"];
  let extAttempt = 0;
  function tryLoadImage(){
    if (extAttempt >= exts.length) {
      img.style.display = "none";
      fallback.style.display = "flex";
      return;
    }
    img.src = `images/${num}.${exts[extAttempt]}`;
    extAttempt++;
  }
  img.addEventListener("error", tryLoadImage);
  tryLoadImage();
  imageWrap.appendChild(img);
  imageWrap.appendChild(fallback);
  body.appendChild(imageWrap);

  const content = document.createElement("div");
  content.className = "q-content";

  const head = document.createElement("div");
  head.className = "q-head";
  if (mode === "term") {
    head.innerHTML = `
      <span class="q-num">第${idx+1}問</span>
      <span class="q-term">${q.term}</span>
      <span class="q-emoji">${q.emoji}</span>
      <span class="q-reading">（${q.reading}）</span>
    `;
  } else {
    head.innerHTML = `
      <span class="q-num">第${idx+1}問</span>
      <span class="q-emoji">${q.emoji}</span>
    `;
  }
  content.appendChild(head);

  if (mode === "meaning") {
    const meaningPrompt = document.createElement("div");
    meaningPrompt.className = "q-meaning-prompt";
    meaningPrompt.textContent = q.choices[q.correct];
    content.appendChild(meaningPrompt);
  }

  const choicesWrap = document.createElement("div");
  choicesWrap.className = "choices";

  const feedback = document.createElement("div");
  feedback.className = "feedback";

  const nextWrap = document.createElement("div");
  nextWrap.className = "next-wrap";
  const nextBtn = document.createElement("button");
  nextBtn.className = "next-btn";
  nextBtn.textContent = current === activeIndices.length - 1 ? "結果を見る" : "次の問題へ";
  nextBtn.addEventListener("click", () => {
    current++;
    if (current < activeIndices.length) {
      renderQuestion();
    } else {
      renderResult();
    }
  });
  nextWrap.appendChild(nextBtn);

  let optionsData;
  if (mode === "term") {
    const order = shuffle([0, 1, 2, 3]);
    optionsData = order.map(origIdx => ({
      text: q.choices[origIdx],
      correct: origIdx === q.correct
    }));
  } else {
    const distractorPool = shuffle(allIndices.filter(i => i !== idx && !(CONFLICTS[q.term] || []).includes(QUESTIONS[i].term))).slice(0, 3);
    const optionIdxs = shuffle([idx, ...distractorPool]);
    optionsData = optionIdxs.map(optIdx => ({
      text: `${QUESTIONS[optIdx].term}（${QUESTIONS[optIdx].reading}）`,
      correct: optIdx === idx
    }));
  }
  const correctPosition = optionsData.findIndex(o => o.correct);

  optionsData.forEach((opt, ci) => {
    const text = opt.text;
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `<span class="label">${LABELS[ci]}</span>${text}`;
    btn.addEventListener("click", () => {
      if (btn.dataset.locked) return;
      const buttons = choicesWrap.querySelectorAll("button.choice");
      buttons.forEach(b => b.dataset.locked = "1");

      if (ci === correctPosition) {
        btn.classList.add("correct");
        feedback.textContent = "○ 正解！";
        feedback.className = "feedback ok";
        score++;
      } else {
        btn.classList.add("wrong");
        buttons[correctPosition].classList.add("correct");
        feedback.textContent = "× 不正解";
        feedback.className = "feedback no";
        wrongIndices.push(idx);
      }
      scoreLabel.textContent = `正解 ${score}`;
      nextBtn.classList.add("show");
    });
    choicesWrap.appendChild(btn);
  });

  content.appendChild(choicesWrap);
  content.appendChild(feedback);
  content.appendChild(nextWrap);
  body.appendChild(content);
  card.appendChild(body);
  quizEl.appendChild(card);
}

function renderResult(){
  const total = activeIndices.length;
  progressLabel.textContent = `終了 / ${total}問中`;
  progressFill.style.width = "100%";
  scoreLabel.textContent = `正解 ${score}`;

  quizEl.innerHTML = "";
  const card = document.createElement("div");
  card.className = "card result-card";

  const pct = Math.round(score / total * 100);
  let msg = "";
  if (pct === 100) msg = "全問正解です！すばらしい！";
  else if (pct >= 80) msg = "よくできました！";
  else if (pct >= 50) msg = "もう少し復習してみましょう。";
  else msg = "もう一度見直してみましょう。";

  card.innerHTML = `
    <div>結果</div>
    <div class="result-score">${score}<span> / ${total}</span></div>
    <div class="result-msg">${msg}</div>
  `;

  const actions = document.createElement("div");
  actions.className = "result-actions";

  const missedThisRun = wrongIndices.slice();

  if (missedThisRun.length > 0) {
    const retryWrongBtn = document.createElement("button");
    retryWrongBtn.className = "btn-primary";
    retryWrongBtn.textContent = `間違えた問題だけやり直す（${missedThisRun.length}問）`;
    retryWrongBtn.addEventListener("click", () => {
      activeIndices = missedThisRun.slice();
      current = 0;
      score = 0;
      wrongIndices = [];
      renderQuestion();
    });
    actions.appendChild(retryWrongBtn);
  }

  const retrySameBtn = document.createElement("button");
  retrySameBtn.className = missedThisRun.length > 0 ? "btn-secondary" : "btn-primary";
  retrySameBtn.textContent = "同じ問題でもう一度";
  retrySameBtn.addEventListener("click", () => {
    current = 0;
    score = 0;
    wrongIndices = [];
    renderQuestion();
  });
  actions.appendChild(retrySameBtn);

  if (activeIndices.length !== allIndices.length) {
    const allBtn = document.createElement("button");
    allBtn.className = "btn-secondary";
    allBtn.textContent = `全${allIndices.length}問に戻る`;
    allBtn.addEventListener("click", () => {
      activeIndices = allIndices.slice();
      current = 0;
      score = 0;
      wrongIndices = [];
      renderQuestion();
    });
    actions.appendChild(allBtn);
  }

  card.appendChild(actions);
  quizEl.appendChild(card);
}

renderQuestion();
</script>
